<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350" fill="none">
  <rect width="600" height="350" fill="#f8faf9" rx="12"/>
  
  <!-- Matahari Sumber Energi Radiasi -->
  <circle cx="80" cy="70" r="35" fill="#f4a261"/>
  <circle cx="80" cy="70" r="42" stroke="#f4a261" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
  
  <!-- Permukaan Bumi -->
  <path d="M0 290 Q300 270 600 290 L600 350 L0 350 Z" fill="#2d6a4f"/>
  <path d="M0 310 Q300 295 600 310 L600 350 L0 350 Z" fill="#1b4332"/>

  <!-- Lapisan Gas Rumah Kaca (Atmosfer) -->
  <path d="M0 160 Q300 130 600 160" stroke="#52b788" stroke-width="6" stroke-dasharray="10 6"/>
  <rect x="210" y="125" width="180" height="26" fill="#d8f3dc" rx="6"/>
  <text x="300" y="142" font-family="sans-serif" font-size="12" font-weight="700" fill="#1b4332" text-anchor="middle">Lapisan Gas Rumah Kaca (CO₂, CH₄)</text>

  <!-- Radiasi Masuk dari Matahari -->
  <path d="M110 95 L220 280" stroke="#f4a261" stroke-width="4" stroke-linecap="round"/>
  <polygon points="220,280 215,268 226,272" fill="#f4a261"/>
  <text x="130" y="200" font-family="sans-serif" font-size="11" font-weight="600" fill="#b06c2c">Radiasi Surya Masuk</text>

  <!-- Sebagian Radiasi Terpental Keluar Ruang Angkasa -->
  <path d="M220 280 L290 145 L340 70" stroke="#e76f51" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 5"/>
  <polygon points="340,70 330,76 341,83" fill="#e76f51"/>
  <text x="310" y="90" font-family="sans-serif" font-size="11" font-weight="600" fill="#e76f51">Radiasi Lolos ke Angkasa</text>

  <!-- Radiasi Terjebak dan Memantul Kembali Memanaskan Bumi -->
  <path d="M290 145 L380 275" stroke="#d90429" stroke-width="4" stroke-linecap="round"/>
  <polygon points="380,275 375,263 386,267" fill="#d90429"/>
  <path d="M380 275 L430 180" stroke="#d90429" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
  <text x="400" y="225" font-family="sans-serif" font-size="12" font-weight="800" fill="#d90429">Panas Terperangkap</text>
  <text x="400" y="242" font-family="sans-serif" font-size="10" fill="#6c757d">(Suhu Global Naik)</text>
</svg>